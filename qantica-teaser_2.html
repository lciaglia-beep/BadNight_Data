<title>Qantica Teaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#000000; --card:#0f0f0e; --card2:#161614; --line:#232321; --line2:#30302c;
    --text:#f4f3ef; --muted:#8b8a84; --amber:#EFAC39; --green:#3CD98A; --red:#E5455F;
    --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --wm:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"Courier Prime","Courier New",Courier,monospace;
    color-scheme:dark;
  }
  html,body{background:var(--bg);color:var(--text)}
  body{font-family:var(--font);padding-inline:16px;padding-block:24px 40px;
    background:radial-gradient(900px 520px at 50% -140px, rgba(239,172,57,.16), rgba(239,172,57,0) 70%), var(--bg)}
  .qx{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .stage{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#030303;aspect-ratio:16/9;max-width:100%;box-shadow:0 30px 80px -30px rgba(239,172,57,.18)}
  .stage.m{aspect-ratio:9/16;width:min(100%, calc(78vh * 9 / 16));margin-inline:auto;border-radius:18px}
  .stage svg{display:block;width:100%;height:100%}
  .grain{position:absolute;inset:-50%;pointer-events:none;opacity:.06;mix-blend-mode:screen;background-size:180px 180px}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%)}
  .snd{position:absolute;top:12px;right:12px;appearance:none;border:1px solid rgba(244,243,239,.25);background:rgba(10,10,9,.72);color:var(--text);border-radius:999px;padding:8px 14px 8px 11px;font:600 13px/1 var(--font);display:inline-flex;gap:8px;align-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:2}
  .snd svg{width:16px;height:16px}
  .snd.on{border-color:var(--amber);color:var(--amber)}
  .snd:focus-visible,.btn:focus-visible,.ph:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

  .bar{display:flex;align-items:center;gap:10px}
  .phases{flex:1;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;min-width:0}
  .ph{appearance:none;cursor:pointer;text-align:left;background:transparent;color:var(--muted);border:0;padding:6px 2px;display:flex;flex-direction:column;gap:7px;font:600 12px/1.15 var(--font);min-width:0;transition:color .2s}
  .ph span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph:hover{color:var(--text)}
  .ph.on{color:var(--text)}
  .ph .tr{height:3px;border-radius:3px;background:var(--line2);overflow:hidden}
  .ph .tr i{display:block;height:100%;width:0;background:var(--amber)}
  .btn{appearance:none;border:0;background:#fff;color:#000;border-radius:999px;padding:0 18px;font:600 14px/1 var(--font);cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;min-height:42px}
  .btn svg{width:15px;height:15px}
  .now{display:none;font:600 13px/1 var(--font);color:var(--text)}
  .now b{font-family:var(--mono);color:var(--amber);font-weight:700;letter-spacing:.08em;margin-right:8px}

  @media (max-width:760px){
    .phases{gap:4px}
    .ph{padding:4px 0}
    .ph span:first-child{display:none}
    .bar{flex-wrap:wrap}
    .phases{order:1;flex-basis:100%}
    .now{display:block;order:2;flex:1}
    .btn{order:3}
  }

  svg.m .dsk{display:none}
  svg:not(.m) .mob{display:none}
  .scene text{pointer-events:none}
  .eyebrow{font-family:var(--mono);font-size:17px;fill:var(--amber);letter-spacing:.16em}
  .title{font-family:var(--wm);font-weight:700;font-size:50px;fill:var(--text);letter-spacing:-.015em}
  .mob .title{font-size:40px}
  .mono{font-family:var(--mono);font-size:15px;fill:var(--text)}
  .monob{font-family:var(--mono);font-weight:700}
  .lbl{font-family:var(--font);font-weight:600;font-size:21px;fill:var(--text)}
  .sub{font-family:var(--font);font-size:15px;fill:var(--muted)}
  .big{font-family:var(--wm);font-weight:700;fill:var(--text)}
  .ink{fill:none;stroke:#f4f3ef;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .inkf{fill:#0f0f0e;stroke:#f4f3ef;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .mut{stroke:#8b8a84}
  .amb{stroke:#EFAC39}
  .grn{stroke:#3CD98A}
  .thin{stroke-width:2.6}
  [data-a="pop"],[data-a="slam"]{transform-box:fill-box;transform-origin:center}
  .hit{fill:transparent;cursor:pointer;pointer-events:all}
  .tap{cursor:pointer}
  .cta{cursor:pointer}
</style>

<div class="qx">
  <div class="stage" id="stage">
    <svg id="qxStage" viewBox="0 0 1280 720" role="img" aria-label="Qantica teaser: verified writers arrive, QIP filters and approves scripts, writers join the community, Qantica and its satellites build the package, the public votes, members unlock more, three routes to production, and Qantica only earns when the project sells">
      <defs>
        <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
          <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
          <feTurbulence id="turb2" type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="2" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <radialGradient id="glow" cx="50%" cy="8%" r="75%">
          <stop offset="0" stop-color="#EFAC39" stop-opacity=".22"/>
          <stop offset=".5" stop-color="#EFAC39" stop-opacity=".04"/>
          <stop offset="1" stop-color="#EFAC39" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="agl"><stop offset="0" stop-color="#EFAC39" stop-opacity=".45"/><stop offset="1" stop-color="#EFAC39" stop-opacity="0"/></radialGradient>
        <radialGradient id="ggl"><stop offset="0" stop-color="#3CD98A" stop-opacity=".5"/><stop offset="1" stop-color="#3CD98A" stop-opacity="0"/></radialGradient>
        <linearGradient id="gateGlow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EFAC39" stop-opacity=".05"/>
          <stop offset="1" stop-color="#EFAC39" stop-opacity=".45"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F8D27A"/><stop offset=".45" stop-color="#EFAC39"/><stop offset="1" stop-color="#C6832A"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3CD98A" stop-opacity="0"/><stop offset=".5" stop-color="#3CD98A" stop-opacity=".9"/><stop offset="1" stop-color="#3CD98A" stop-opacity="0"/>
        </linearGradient>
        <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="9" stroke="#EFAC39" stroke-width="2.2" opacity=".55"/>
        </pattern>
        <pattern id="hatchD" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="10" stroke="#1a1206" stroke-width="2" opacity=".18"/>
        </pattern>
        <pattern id="hatchG" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="9" stroke="#3CD98A" stroke-width="2" opacity=".45"/>
        </pattern>
        <clipPath id="cardClip"><rect x="430" y="110" width="420" height="260" rx="24"/></clipPath>
      </defs>
      <rect x="-400" y="-400" width="2080" height="1760" fill="#030303"/>
      <rect id="bgGlow" width="1280" height="720" fill="url(#glow)"/>
      <g id="dust"></g>
      <g id="scenes"></g>
      <rect id="flash" x="-400" y="-400" width="2080" height="1760" fill="#3CD98A" opacity="0" pointer-events="none"/>
      <g id="wordmark" class="dsk"><text class="big" x="44" y="76" style="font-size:22px;font-weight:800;letter-spacing:.02em">QANTICA<tspan style="fill:#EFAC39"> .</tspan></text></g>
      <g id="bars" pointer-events="none">
        <rect id="barT" x="-400" y="-400" width="2080" height="434" fill="#000"/>
        <rect id="barB" x="-400" y="686" width="2080" height="700" fill="#000"/>
      </g>
    </svg>
    <div class="grain" id="grain"></div>
    <div class="vignette"></div>
    <button class="snd" id="snd" type="button" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path id="sndWave" d="M11 5.5c1 .8 1 4.2 0 5M13 3.5c2 1.8 2 7.2 0 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".35"/></svg>
      <span id="sndLbl">Sound off</span>
    </button>
  </div>

  <div class="bar">
    <nav class="phases" id="phases" aria-label="Phases"></nav>
    <span class="now" id="now"></span>
    <button class="btn" id="replay" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2v3h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Replay
    </button>
  </div>
</div>

<script>
(() => {
  const DUR = 60;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('qxStage');
  const $ = id => document.getElementById(id);
  const E = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (attrs.class && /\bink/.test(attrs.class)) { if (attrs.fill) e.style.fill = attrs.fill; if (attrs.stroke) e.style.stroke = attrs.stroke; }
    if (parent) parent.appendChild(e);
    return e;
  };
  const T = (parent, x, y, str, cls, style, anchor) => {
    const t = E('text', { x, y, class: cls || '', style: style || '' }, parent);
    if (anchor) t.setAttribute('text-anchor', anchor);
    t.textContent = str; return t;
  };
  const A = (el, a, t, d, o) => { el.setAttribute('data-a', a); el.setAttribute('data-t', t); el.setAttribute('data-d', d); if (o !== undefined) el.setAttribute('data-o', o); return el; };
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const eo = r => 1 - Math.pow(1 - r, 3);
  const eio = r => r < .5 ? 4 * r * r * r : 1 - Math.pow(-2 * r + 2, 3) / 2;
  const bo = r => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(r - 1, 3) + c1 * Math.pow(r - 1, 2); };
  const kf = (keys, lt) => {
    if (lt <= keys[0][0]) return [keys[0][1], keys[0][2]];
    for (let k = 0; k < keys.length - 1; k++) {
      const [t0, x0, y0] = keys[k], [t1, x1, y1] = keys[k + 1];
      if (lt <= t1) { const u = (lt - t0) / (t1 - t0), q = u * u * (3 - 2 * u); return [x0 + (x1 - x0) * q, y0 + (y1 - y0) * q]; }
    }
    const l = keys[keys.length - 1]; return [l[1], l[2]];
  };
  let MOB = false;
  const HEART = 'M0 10 C -16 -2 -12 -16 -3 -13 C -1 -12 0 -9 0 -8 C 0 -9 1 -12 3 -13 C 12 -16 16 -2 0 10 Z';
  const NSS = { 'vector-effect': 'non-scaling-stroke' };
  const INK = Object.assign({ stroke: '#f4f3ef', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, NSS);
  const G = '#3CD98A', AM = '#EFAC39', RD = '#E5455F', TX = '#f4f3ef', MU = '#8b8a84';
  const rough = p => E('g', { filter: 'url(#rough)' }, p);
  const FONT = 'font-family:var(--font);';

  const PH = [
    { name: 'Writers', s: 0 }, { name: 'Profile', s: 7 }, { name: 'QIP', s: 12 }, { name: 'Community', s: 22 },
    { name: 'Package', s: 28 }, { name: 'Showcase', s: 35 }, { name: 'Routes', s: 44 }, { name: 'Model', s: 51 }, { name: 'Qantica', s: 56 }
  ];

  /* ---------- building blocks ---------- */
  const blocks = [];
  const B = (parent, m, cls) => { const g = E('g', cls ? { class: cls } : {}, parent); g._m = m; blocks.push(g); return g; };
  const scenesRoot = $('scenes');
  const SC = [];
  function mkScene(s, e) {
    const el = E('g', { class: 'scene', 'data-s': s, 'data-e': e }, scenesRoot);
    const cam = E('g', {}, el);
    const caps = E('g', {}, el);
    const o = { el, cam, caps, s, e }; SC.push(o); return o;
  }
  function captions(S, list) {
    list.forEach(c => {
      const g = A(E('g', {}, S.caps), 'cap', c.t, .6, c.o === undefined ? 999 : c.o);
      const d = E('g', { class: 'dsk' }, g);
      T(d, 80, 590, c.ey, 'eyebrow');
      const tt = T(d, 80, 646, c.d, 'title'); E('tspan', { style: 'fill:#EFAC39' }, tt).textContent = '.';
      const m = E('g', { class: 'mob' }, g);
      T(m, 32, 792, c.ey, 'eyebrow');
      T(m, 32, 842, c.m[0], 'title');
      const t2 = T(m, 32, 890, c.m[1], 'title'); E('tspan', { style: 'fill:#EFAC39' }, t2).textContent = '.';
    });
  }
  const pill = (parent, x, y, w, h, fill, label, tstyle) => {
    E('rect', { x, y, width: w, height: h, rx: h / 2, fill }, parent);
    return T(parent, x + w / 2, y + h / 2 + 6, label, '', tstyle, 'middle');
  };
  const chipW = label => 30 + label.length * 8.4;
  const chip = (parent, x, y, label, color, center) => {
    const w = chipW(label); if (center) x -= w / 2;
    E('rect', { x, y, width: w, height: 32, rx: 16, fill: color === G ? 'rgba(60,217,138,.12)' : color === AM ? 'rgba(239,172,57,.12)' : '#161614', stroke: color, 'stroke-width': 2 }, parent);
    T(parent, x + w / 2, y + 21, label, 'monob', `font-size:14px;fill:${color}`, 'middle');
    return w;
  };
  const check = (parent, cx, cy, r, col) => {
    E('circle', { cx, cy, r, fill: col || G }, parent);
    E('path', { d: `M${cx - r * .45} ${cy} l ${r * .32} ${r * .32} l ${r * .62} ${r * .66 * -1}`, fill: 'none', stroke: '#000', 'stroke-width': Math.max(2.4, r * .22), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
  };
  function makeCursor(scene, keys, clicks, stay) {
    const g = E('g', { opacity: 0 }, scene);
    const rip = E('circle', { r: 0, fill: 'none', stroke: AM, 'stroke-width': 3 }, g);
    const arrow = E('path', { d: 'M0 0 L 0 30 L 8 23 L 14 36 L 20 33 L 14 21 L 25 21 Z', fill: TX, stroke: '#050505', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
    return { g, rip, arrow, keys, clicks, stay };
  }
  function updCursor(c, lt) {
    const [x, y] = kf(c.keys, lt);
    const first = c.keys[0][0], lastK = c.keys[c.keys.length - 1][0];
    const vis = clamp((lt - first + 0.3) / 0.3) * (c.stay ? 1 : 1 - clamp((lt - lastK) / 0.4));
    c.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    c.g.setAttribute('opacity', vis.toFixed(3));
    let press = 1, rr = 0, ro = 0;
    c.clicks.forEach(ct => { const d = lt - ct; if (d >= 0 && d < 0.5) { rr = 6 + 44 * d; ro = 1 - d / 0.5; } if (d >= 0 && d < 0.16) press = 0.82; });
    c.arrow.setAttribute('transform', `scale(${press})`);
    c.rip.setAttribute('r', rr.toFixed(1)); c.rip.setAttribute('opacity', ro.toFixed(3));
  }
  const pressScale = (lt, ct) => { const d = lt - ct; return d >= 0 && d < 0.25 ? 1 - 0.08 * Math.sin(Math.PI * d / 0.25) : 1; };
  const scaleAbout = (el, cx, cy, k) => el.setAttribute('transform', `translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})`);

  const HAIRS = [AM, TX, '#C6832A', MU, AM, '#f4f3ef', '#C6832A', MU];
  function head(parent, x, y, r, hairCol, style) {
    E('circle', { cx: x, cy: y, r, class: 'inkf' }, parent);
    if (style === 1) E('path', { d: `M${x - r} ${y + r * .2} C ${x - r * 1.1} ${y - r * 1.3} ${x + r * 1.1} ${y - r * 1.3} ${x + r} ${y + r * .2} L ${x + r * .7} ${y - r * .3} C ${x + r * .2} ${y - r * .6} ${x - r * .3} ${y - r * .6} ${x - r * .7} ${y - r * .3} Z`, fill: hairCol, class: 'ink thin' }, parent);
    else if (style === 2) E('path', { d: `M${x - r * 1.05} ${y - r * .35} Q ${x} ${y - r * 1.55} ${x + r * 1.05} ${y - r * .45} Q ${x} ${y - r * .75} ${x - r * 1.05} ${y - r * .35} Z`, fill: hairCol, class: 'ink thin' }, parent);
    else E('path', { d: `M${x - r} ${y - r * .1} C ${x - r} ${y - r * 1.15} ${x + r * .75} ${y - r * 1.3} ${x + r} ${y - r * .3} C ${x + r * .55} ${y - r * .55} ${x - r * .15} ${y - r * .6} ${x - r * .6} ${y - r * .25} Z`, fill: hairCol, class: 'ink thin' }, parent);
    E('circle', { cx: x + r * .18, cy: y + r * .08, r: Math.max(1.8, r * .1), fill: TX }, parent);
    E('circle', { cx: x + r * .56, cy: y + r * .08, r: Math.max(1.8, r * .1), fill: TX }, parent);
    E('path', { d: `M${x + r * .1} ${y + r * .45} q ${r * .25} ${r * .2} ${r * .5} 0`, class: 'ink thin' }, parent);
  }
  function walker(parent, hairCol, style, badge) {
    const g = E('g', {}, parent);
    const inner = E('g', {}, g);
    const armB = E('path', { class: 'ink', d: '' }, inner);
    const legs = E('path', { class: 'ink', d: '' }, inner);
    E('path', { d: 'M-17 -98 Q 0 -108 17 -98 L 15 -50 Q 0 -44 -15 -50 Z', class: 'inkf' }, inner);
    if (badge) { E('circle', { cx: 0, cy: -76, r: 11, fill: AM }, inner); T(inner, 0, -71, 'Q', 'big', 'font-size:14px;font-weight:800;fill:#000', 'middle'); }
    else E('rect', { x: 6, y: -88, width: 20, height: 26, rx: 2, fill: AM, stroke: TX, 'stroke-width': 2, transform: 'rotate(8 16 -75)' }, inner);
    head(inner, 0, -124, 21, hairCol, style);
    const armF = E('path', { class: 'ink', d: '' }, inner);
    return { g, inner, legs, armB, armF };
  }
  function pose(w, ph, moving) {
    const s = moving ? Math.sin(ph) : 0;
    const l1 = 5 + s * 17, l2 = -5 - s * 17;
    w.legs.setAttribute('d', `M4 -50 L ${l1.toFixed(1)} 0 L ${(l1 + 9).toFixed(1)} 0 M -4 -50 L ${l2.toFixed(1)} 0 L ${(l2 + 9).toFixed(1)} 0`);
    w.armF.setAttribute('d', `M9 -92 L ${(12 - s * 15).toFixed(1)} -58`);
    w.armB.setAttribute('d', `M-9 -92 L ${(-12 + s * 15).toFixed(1)} -58`);
    w.inner.setAttribute('transform', `translate(0 ${(-Math.abs(s) * 3).toFixed(1)})`);
  }

  /* =========================================================
     SCENE 0 · WRITERS ARRIVE / IMDb GATE  (0 – 7.3)
     ========================================================= */
  const S0 = mkScene(0, 7.3);
  const b0 = B(S0.cam, 'translate(-235 287.5) scale(.75)');
  const f0 = rough(b0);
  A(E('path', { d: 'M-80 470 L 1280 470', class: 'ink mut thin' }, f0), 'draw', .3, 1.0);
  E('ellipse', { cx: 1090, cy: 470, rx: 150, ry: 16, fill: 'url(#agl)' }, b0);
  const gateGlow = E('rect', { x: 902, y: 200, width: 76, height: 270, fill: 'url(#gateGlow)', opacity: .4 }, b0);
  const gate = A(E('g', {}, rough(b0)), 'draw', .4, .9);
  E('rect', { x: 880, y: 200, width: 22, height: 270, rx: 4, class: 'inkf' }, gate);
  E('rect', { x: 978, y: 200, width: 22, height: 270, rx: 4, class: 'inkf' }, gate);
  E('path', { d: 'M868 204 Q 940 128 1012 204', class: 'ink' }, gate);
  E('path', { d: 'M940 166 L 940 172', class: 'ink thin' }, gate);
  const gateTop = A(E('g', {}, b0), 'fade', .9, .5);
  const wmG = T(gateTop, 940, 94, 'QANTICA', 'big', 'font-size:28px;font-weight:800;letter-spacing:.04em', 'middle');
  E('tspan', { style: 'fill:#EFAC39' }, wmG).textContent = '.';
  E('rect', { x: 868, y: 106, width: 144, height: 28, rx: 14, fill: '#161614', stroke: AM, 'stroke-width': 2 }, gateTop);
  T(gateTop, 940, 125, 'IMDb CHECK', 'monob', 'font-size:13px;fill:#EFAC39;letter-spacing:.1em', 'middle');

      const v = Math.ceil(23 * (1 - clamp((lt - 4.8) / 2.4)));
      ipi.textContent = v; ipi.style.fill = v === 0 ? G : TX;
    },
    lt => { // 3 community
      nodes.forEach(n => {
        const u = eo(clamp((lt - n.t) / .6)), k = 1 + .7 * (1 - u);
        n.g.setAttribute('opacity', u.toFixed(3));
        n.g.setAttribute('transform', `translate(${((n.x - CX) * (k - 1)).toFixed(1)} ${((n.y - CY) * (k - 1)).toFixed(1)})`);
      });
      pulses.forEach(p => {
        if (lt < 2.8) { p.c.setAttribute('opacity', 0); return; }
        const u = (W * .55 + p.off) % 1;
        p.c.setAttribute('cx', (p.e.p.x + (p.e.q.x - p.e.p.x) * u).toFixed(1));
        p.c.setAttribute('cy', (p.e.p.y + (p.e.q.y - p.e.p.y) * u).toFixed(1));
        p.c.setAttribute('opacity', (Math.sin(Math.PI * u) * clamp((lt - 2.8) / .5)).toFixed(3));
      });
    },
    lt => { // 4 package
      sats.forEach(s => {
        const u = eio(clamp((lt - s.tk) / .8)), a = s.a - (1 - u) * 1.2;
        s.g.setAttribute('opacity', clamp((lt - s.tk) / .25).toFixed(3));
        s.g.setAttribute('transform', `translate(${(640 + 360 * Math.cos(a)).toFixed(1)} ${(300 + 190 * Math.sin(a)).toFixed(1)}) scale(${(.7 + .3 * u).toFixed(3)})`);
      });
    },
    lt => { // 5 showcase + membership
      people.forEach((p, i) => {
        const jump = lt > 1 && lt < 3.8 ? Math.max(0, Math.sin((lt - 1 - i * .15) * 6)) * 7 : 0;
        p.setAttribute('transform', `translate(0 ${(Math.sin(W * 3 + i) * 2.5 - jump).toFixed(2)})`);
      });
      hearts.forEach(h => {
        const u = (lt - h.s) / 1.8;
        if (u < 0 || u > 1) { h.g.setAttribute('opacity', 0); return; }
        h.g.setAttribute('opacity', (Math.min(1, u * 6) * (1 - u)).toFixed(3));
        h.g.setAttribute('transform', `translate(${(h.x + Math.sin(u * 6 + h.s) * 12).toFixed(1)} ${(405 - 175 * u).toFixed(1)}) scale(${(.8 + .6 * u).toFixed(2)})`);
      });
      votesEl.textContent = (Math.round(12480 * eo(clamp((lt - .6) / 3.4))) + userVotes).toLocaleString('en-US');
      const su = clamp((lt - 5.2) / 1.0);
      shine.setAttribute('x', (300 + su * 700).toFixed(1));
      shine.setAttribute('opacity', su > 0 && su < 1 ? 1 : 0);
      tiles.forEach((tl, k) => {
        const u = bo(clamp((lt - (5.5 + k * .35)) / .35)), lu = clamp(u);
        tl.sh.setAttribute('transform', `translate(0 ${(-8 * u).toFixed(2)}) rotate(${(-38 * u).toFixed(1)} -9 -2)`);
        tl.body.setAttribute('fill', lu >= 1 ? G : AM);
        tl.content.setAttribute('opacity', (.3 + .7 * lu).toFixed(3));
        tl.bg.style.stroke = lu >= 1 ? AM : TX;
      });
    },
    lt => { // 6 routes
      routeEls.forEach((r, k) => {
        const on = selRoute === k;
        [r.dbg, r.mbg].forEach(b => b.style.stroke = on ? AM : TX);
        const op = selRoute === null || on ? 1 : .45;
        r.dO.style.opacity = op; r.mO.style.opacity = op;
      });
    },
    lt => { // 7 model
      const fo = 1 - clamp((lt - 2.75) / .3);
      coins.forEach((c, idx) => {
        const u = (lt - c.s) / .9;
        if (u < 0) { c.c.setAttribute('opacity', 0); return; }
        const y = u < 1 ? 40 + 290 * u * u : 330 - (idx % 3) * 6;
        c.c.setAttribute('cx', c.x); c.c.setAttribute('cy', y.toFixed(1));
        c.c.setAttribute('opacity', fo.toFixed(3));
      });
    },
    lt => { } // 8 end
  ];

  const barT = $('barT'), barB = $('barB'), flash = $('flash'), wordmark = $('wordmark');
  const FLASHES = [19.9, 32.7];
  const dustG = $('dust'), dust = [];
  for (let i = 0; i < 26; i++) {
    const q = Math.abs(Math.sin(i * 91.7) * 1000) % 1;
    dust.push({ c: E('circle', { r: 1.2 + q * 2.2, fill: i % 3 ? TX : AM, opacity: 0 }, dustG), x: q * 1280, y: (i * 137) % 720, v: 8 + q * 16, a: .08 + q * .22, ph: i });
  }
  function render(t) {
    scenes.forEach((sc, i) => {
      const fin = sc.s === 0 ? 1 : clamp((t - sc.s) / 0.35);
      const fout = sc.e >= DUR ? 1 : clamp((sc.e - t) / 0.35);
      const vis = t < sc.s ? 0 : Math.min(fin, fout);
      sc.el.style.opacity = vis;
      sc.el.style.visibility = vis <= 0.001 ? 'hidden' : 'visible';
      if (vis <= 0.001) return;
      const lt = t - sc.s;
      sc.items.forEach(it => apply(it, lt));
      custom[i](lt);
      const k = 1 + .035 * clamp(lt / (sc.e - sc.s));
      if (MOB) scaleAbout(sc.cam, 270, 430, k); else scaleAbout(sc.cam, 640, 330, k);
    });
    const p = eio(clamp(t / 1.4));
    const h0 = MOB ? 40 : 34, hm = MOB ? 480 : 360, H = MOB ? 960 : 720;
    const h = h0 + (hm - h0) * (1 - p);
    barT.setAttribute('height', (400 + h).toFixed(1));
    barB.setAttribute('y', (H - h).toFixed(1));
    wordmark.style.opacity = (clamp((t - 1) / .5) * (1 - clamp((t - 55.7) / .3))).toFixed(3);
    let fl = 0; FLASHES.forEach(ft => { if (t >= ft) fl = Math.max(fl, .3 * (1 - clamp((t - ft) / .45))); });
    flash.setAttribute('opacity', fl.toFixed(3));
    const Wd = MOB ? 540 : 1280, Hd = MOB ? 960 : 720;
    dust.forEach(d => {
      const y = ((d.y - W * d.v) % Hd + Hd) % Hd, x = (d.x * Wd / 1280 + Math.sin(W * .4 + d.ph) * 12);
      d.c.setAttribute('cx', x.toFixed(1)); d.c.setAttribute('cy', y.toFixed(1));
      d.c.setAttribute('opacity', (d.a * (0.6 + 0.4 * Math.sin(W + d.ph))).toFixed(3));
    });
    for (let k = uhearts.length - 1; k >= 0; k--) {
      const hh = uhearts[k], u = (W - hh.born) / 1.4;
      if (u > 1) { hh.g.remove(); uhearts.splice(k, 1); continue; }
      hh.g.setAttribute('opacity', (1 - u).toFixed(3));
      hh.g.setAttribute('transform', `translate(${(hh.x + Math.sin(u * 7 + hh.x) * 10).toFixed(1)} ${(hh.y - 150 * u).toFixed(1)}) scale(${(1.2 + .5 * u).toFixed(2)})`);
    }
  }

  /* =========================================================
     SOUND (Web Audio, synthesized — no files)
     ========================================================= */
  const AU = { ctx: null, master: null, on: false, noise: null, pad: null };
  function auInit() {
    if (AU.ctx) return true;
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
    try {
      AU.ctx = new C();
      AU.master = AU.ctx.createGain(); AU.master.gain.value = .85;
      const comp = AU.ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
      AU.master.connect(comp); comp.connect(AU.ctx.destination);
      const len = AU.ctx.sampleRate * 2, b = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      AU.noise = b; return true;
    } catch (e) { AU.ctx = null; return false; }
  }
  function tone(f, dur, type, vol, delay, f2, attack) {
    const c = AU.ctx, t0 = c.currentTime + (delay || 0), at = attack || .006;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + at); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AU.master); o.start(t0); o.stop(t0 + dur + .05);
  }
  function noise(dur, vol, type, f, f2, q, delay, attack) {
    const c = AU.ctx, t0 = c.currentTime + (delay || 0), at = attack || .01;
    const s = c.createBufferSource(); s.buffer = AU.noise;
    const fl = c.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.setValueAtTime(f || 1000, t0);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    fl.Q.value = q || 1;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + at); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(t0, Math.random()); s.stop(t0 + dur + .05);
  }
  const FX = {
    click() { tone(1800, .045, 'sine', .16); noise(.03, .1, 'highpass', 4000); },
    blip() { tone(660, .12, 'sine', .07, 0, 1050); },
    whoosh() { noise(.55, .2, 'bandpass', 380, 2600, 1.3, 0, .14); },
    whooshLong() { noise(1.5, .18, 'bandpass', 180, 1800, 1.2, 0, .6); },
    boom() { tone(68, 1.5, 'sine', .7, 0, 30, .01); noise(.9, .22, 'lowpass', 700, 90, .7); },
    scan() { tone(240, .32, 'sawtooth', .03, 0, 900); tone(1250, .08, 'sine', .05, .26); },
    tick() { tone(1320, .09, 'triangle', .12); tone(1760, .12, 'sine', .07, .05); },
    approveShort() { tone(880, .12, 'sine', .12); tone(1320, .2, 'sine', .09, .07); },
    deny() { tone(196, .15, 'square', .05); tone(156, .22, 'square', .05, .12); },
    stamp() { tone(92, .5, 'sine', .9, 0, 36); noise(.28, .45, 'lowpass', 1500, 180, .8); noise(.07, .25, 'highpass', 2200); },
    approve() { [659, 988, 1319].forEach((f, i) => tone(f, 1.0, 'sine', .11, i * .08)); },
    ding() { tone(1568, .5, 'sine', .07); tone(2349, .4, 'sine', .035, .02); },
    chime() { tone(1047, .5, 'sine', .09); tone(1568, .7, 'sine', .07, .1); },
    coin() { tone(988, .07, 'square', .045); tone(1319, .22, 'square', .045, .07); },
    unlock() { tone(1100, .05, 'square', .045); tone(1650, .18, 'sine', .1, .05); },
    shine() { [2093, 2637, 3136].forEach((f, i) => tone(f, .45, 'sine', .035, i * .06)); },
    pop() { tone(420, .12, 'sine', .16, 0, 880); },
    cheer() {
      for (let i = 0; i < 16; i++) noise(.5 + Math.random() * .6, .04 + Math.random() * .04, 'bandpass', 800 + Math.random() * 1600, null, 2.5, i * .07, .06);
      for (let i = 0; i < 10; i++) noise(.03, .08, 'highpass', 2500, null, 1, .15 + i * .09 + Math.random() * .05);
    },
    riser() { noise(1.7, .16, 'bandpass', 200, 5200, 2, 0, 1.5); tone(110, 1.7, 'triangle', .05, 0, 440, 1.4); },
    finale() { [110, 220, 277.2, 329.6, 440, 554.4].forEach((f, i) => tone(f, 3.2, i < 2 ? 'triangle' : 'sine', i < 2 ? .09 : .06, 0, null, .02)); }
  };
  function play(name) { if (AU.on && AU.ctx && FX[name]) { try { FX[name](); } catch (e) {} } }
  function padStart() {
    if (AU.pad || !AU.ctx) return;
    const c = AU.ctx, g = c.createGain();
    g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.045, c.currentTime + 2);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = .4;
    lp.connect(g); g.connect(AU.master);
    const oscs = [0, 1, 2, 3].map(() => { const o = c.createOscillator(); o.type = 'triangle'; o.connect(lp); o.start(); return o; });
    const chords = [[110, 164.8, 220, 261.6], [87.3, 130.8, 174.6, 220], [130.8, 196, 261.6, 329.6], [98, 146.8, 196, 246.9]];
    let idx = 0;
    const setChord = () => { const ch = chords[idx++ % 4], now = c.currentTime; oscs.forEach((o, i) => o.frequency.setTargetAtTime(ch[i] * (i % 2 ? 1.004 : .996), now, .5)); };
    setChord();
    AU.pad = { g, oscs, iv: setInterval(setChord, 4000) };
  }
  function padStop() {
    if (!AU.pad) return;
    const { g, oscs, iv } = AU.pad, c = AU.ctx; clearInterval(iv);
    g.gain.cancelScheduledValues(c.currentTime); g.gain.setValueAtTime(Math.max(.0001, g.gain.value), c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 1.2);
    oscs.forEach(o => o.stop(c.currentTime + 1.3)); AU.pad = null;
  }
  const CUES = [];
  const cue = (tt, n) => CUES.push([tt, n]);
  cue(.02, 'boom'); cue(.1, 'whooshLong');
  writers.forEach((w, i) => { const tc = WS(i) + WALK + .32; cue(tc - .3, 'blip'); cue(tc, w.ok ? 'approveShort' : 'deny'); });
  cue(7.1, 'whoosh'); cue(8.2, 'click'); cue(9.0, 'click'); cue(9.75, 'click'); cue(9.9, 'whoosh'); cue(11.3, 'chime');
  cue(12.05, 'whoosh');
  pages.forEach(p => { cue(12 + p.s + 1.31, 'scan'); cue(12 + p.s + 1.91, p.ok ? 'tick' : 'deny'); });
  cue(16.2, 'whoosh'); [0, 1, 2, 3, 4].forEach(k => cue(16.9 + k * .5, 'tick'));
  cue(19.9, 'stamp'); cue(19.95, 'approve');
  cue(22.05, 'whoosh'); nodes.forEach((n, i) => { if (i % 2 === 0) cue(22 + n.t + .1, 'blip'); });
  cue(28.05, 'whoosh'); sats.forEach(s => cue(28 + s.tk + .8, 'ding')); cue(32.7, 'stamp'); cue(32.75, 'approve');
  cue(35.05, 'whoosh'); cue(36.1, 'cheer'); cue(39.4, 'whoosh'); cue(40.2, 'shine'); [0, 1, 2, 3].forEach(k => cue(40.5 + k * .35, 'unlock'));
  [0, 1, 2].forEach(k => cue(44.35 + k * .7, 'whoosh'));
  cue(51.05, 'whoosh'); [0, 2, 4, 6, 8, 10, 12].forEach(i => cue(51 + .6 + i * .1 + .9, 'coin')); cue(53.95, 'deny');
  cue(54.4, 'riser'); cue(56.15, 'boom'); cue(56.2, 'finale');
  CUES.sort((a, b) => a[0] - b[0]);

  /* =========================================================
     INTERACTIONS + CONTROLS
     ========================================================= */
  crowdHit.addEventListener('pointerdown', e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(g5c.getScreenCTM().inverse());
    const g = E('g', {}, uheartsG);
    E('path', { d: HEART, fill: Math.random() < .5 ? RD : AM, stroke: '#050505', 'stroke-width': 1.5 }, g);
    uhearts.push({ g, x: q.x, y: q.y, born: W });
    userVotes++; play('pop');
  });
  routeEls.forEach((r, k) => [r.dO, r.mO].forEach(el => el.addEventListener('click', () => { selRoute = selRoute === k ? null : k; play('click'); })));
  cta.addEventListener('click', () => play('click'));

  const phNav = $('phases'), nowEl = $('now');
  const phEls = PH.map((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ph'; b.setAttribute('aria-label', p.name);
    b.innerHTML = `<span>${p.name}</span><span class="tr"><i></i></span>`;
    b.addEventListener('click', () => { seek(i === 0 ? 0 : p.s + .36); playing = true; play('click'); });
    phNav.appendChild(b);
    return { b, fill: b.querySelector('i') };
  });
  let prevT = 0;
  function seek(nt) { t = clamp(nt, 0, DUR); prevT = t; if (t < PH[6].s) selRoute = null; }
  $('replay').addEventListener('click', () => { seek(0); userVotes = 0; playing = true; play('click'); });
  const sndBtn = $('snd'), sndLbl = $('sndLbl'), sndWave = $('sndWave');
  function setSnd(on) {
    AU.on = on;
    sndBtn.classList.toggle('on', on); sndBtn.setAttribute('aria-pressed', on);
    sndLbl.textContent = on ? 'Sound on' : 'Sound off';
    sndWave.setAttribute('opacity', on ? 1 : .35);
    if (!on) padStop();
  }
  sndBtn.addEventListener('click', () => {
    if (!AU.on) {
      if (!auInit()) { sndLbl.textContent = 'No audio'; return; }
      AU.ctx.resume && AU.ctx.resume();
      setSnd(true); play('click');
      if (t >= DUR - .05) { seek(0); playing = true; }
    } else setSnd(false);
  });

  let lastPh = -1;
  function updUI() {
    let cur = 0;
    PH.forEach((p, i) => {
      const end = i < PH.length - 1 ? PH[i + 1].s : DUR;
      phEls[i].fill.style.width = (clamp((t - p.s) / (end - p.s)) * 100).toFixed(1) + '%';
      if (t >= p.s) cur = i;
    });
    if (cur !== lastPh) {
      lastPh = cur;
      phEls.forEach((e, i) => { e.b.classList.toggle('on', i === cur); e.b.setAttribute('aria-current', i === cur ? 'step' : 'false'); });
      nowEl.innerHTML = `<b>${String(cur + 1).padStart(2, '0')}</b>${PH[cur].name}`;
    }
  }

  // film grain
  const grainEl = $('grain');
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 180;
    const cx = cv.getContext('2d'), im = cx.createImageData(180, 180);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    cx.putImageData(im, 0, 0);
    grainEl.style.backgroundImage = `url(${cv.toDataURL()})`;
  } catch (e) {}

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const turb = $('turb'), turb2 = $('turb2'); let seed = 0;
  if (!reduce) {
    setInterval(() => { grainEl.style.backgroundPosition = `${Math.floor(Math.random() * 180)}px ${Math.floor(Math.random() * 180)}px`; }, 220);
  }

  // layout: desktop 16:9 ↔ phone 9:16
  const stageEl = $('stage'), wrapEl = document.querySelector('.qx');
  function setLayout() {
    const m = wrapEl.clientWidth < 640;
    if (m === MOB && svg.dataset.init) return;
    svg.dataset.init = '1'; MOB = m;
    svg.classList.toggle('m', m); stageEl.classList.toggle('m', m);
    svg.setAttribute('viewBox', m ? '0 0 540 960' : '0 0 1280 720');
    $('bgGlow').setAttribute('transform', m ? 'translate(-370 0) scale(1 1.4)' : '');
    blocks.forEach(g => { if (m && g._m) g.setAttribute('transform', g._m); else g.removeAttribute('transform'); });
    scenes.forEach(sc => sc.items.forEach(it => it.last = -1));
  }
  setLayout();
  window.addEventListener('resize', setLayout);

  // autoplay when visible (landing page)
  let userPaused = false;
  if (reduce) { t = DUR; prevT = t; }
  else if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting && en.intersectionRatio >= .35) { if (t < DUR) playing = true; }
      else { playing = false; padStop(); }
    }), { threshold: [0, .35, .7] }).observe(stageEl);
  } else playing = true;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    W += dt;
    if (playing) { t += dt; if (t >= DUR) { t = DUR; playing = false; } }
    if (playing && AU.on) CUES.forEach(([ct, n]) => { if (ct > prevT && ct <= t) play(n); });
    prevT = t;
    render(t); updUI();
    requestAnimationFrame(frame);
  }
  render(t); updUI();
  requestAnimationFrame(frame);
})();
